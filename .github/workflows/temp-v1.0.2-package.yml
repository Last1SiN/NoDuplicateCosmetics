name: Temporary v1.0.2 package

on:
  push:
    branches:
      - perf-fix-v1.0.2

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact performance-fix branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import hashlib
          import tomllib
          import zipfile

          root = Path("NoDuplicateCosmetics")
          source = root / "__init__.py"
          metadata = root / "pyproject.toml"
          archive = Path("dist/NoDuplicateCosmetics.sdkmod")

          text = source.read_text(encoding="utf-8")
          compile(text, str(source), "exec")
          ast.parse(text, filename=str(source))

          data = tomllib.loads(metadata.read_text(encoding="utf-8"))
          project = data["project"]
          sdkmod = data["tool"]["sdkmod"]

          assert project["name"] == "NoDuplicateCosmetics"
          assert sdkmod["name"] == "NoDuplicateCosmetics"
          assert project["version"] == sdkmod["version"] == "1.0.2"
          for version in (project["version"], sdkmod["version"]):
              assert tuple(int(x) for x in version.split(".")) == (1, 0, 2)

          assert sdkmod["coop_support"] == "Unknown"
          assert sdkmod["supported_games"] == ["BL3"]

          # Global ItemPoolData enumeration is allowed only in the full
          # initial/world-transition discovery path.
          assert text.count('find_all("ItemPoolData"') == 1
          assert "_refresh_unknown_source_now_if_needed" not in text
          assert "_schedule_source_rediscovery_if_needed" not in text
          assert "NoDuplicateCosmetics_perf.log" not in text
          assert "PERF_DIAG_BUILD" not in text

          required = {
              "NoDuplicateCosmetics/__init__.py",
              "NoDuplicateCosmetics/pyproject.toml",
              "NoDuplicateCosmetics/README_EN.md",
              "NoDuplicateCosmetics/README_RU.md",
              "NoDuplicateCosmetics/LICENSE",
              "NoDuplicateCosmetics/ADDITIONAL_TERMS.md",
          }

          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix not in {".pyc", ".pyo"}:
                      zf.write(path, path.as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              roots = {n.split("/", 1)[0] for n in names}
              assert archive.stem == "NoDuplicateCosmetics"
              assert roots == {"NoDuplicateCosmetics"}
              assert set(names) == required
              assert len(names) == 6

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("ALL_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: NoDuplicateCosmetics-v1.0.2-candidate
          path: dist/NoDuplicateCosmetics.sdkmod
          if-no-files-found: error
