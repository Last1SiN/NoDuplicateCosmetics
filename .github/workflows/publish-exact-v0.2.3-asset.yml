name: Publish exact tested v0.2.3 asset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-exact-v0.2.3-asset.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify exact runtime-tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/e1f97e129466553a46a6691e9dfd5882231cb6d8" --jq .content \
            | tr -d '\n' \
            | base64 --decode > /tmp/NoDuplicateCosmetics.sdkmod
          echo '3762a2942478fe67a798b86ec91ad13c666bb2a7231221552db4493e6defc29a  /tmp/NoDuplicateCosmetics.sdkmod' \
            | sha256sum --check --strict

      - name: Attach exact artifact to v0.2.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.2.3 /tmp/NoDuplicateCosmetics.sdkmod --clobber

      - name: Remove one-off upload workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upload-exact-v0.2.3-asset.yml
          git rm .github/workflows/publish-exact-v0.2.3-asset.yml
          git commit -m "Remove one-off exact release asset uploaders"
          git push origin HEAD:main
