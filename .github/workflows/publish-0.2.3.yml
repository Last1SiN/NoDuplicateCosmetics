name: Publish 0.2.3 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.2.3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: e83d3c1bc8d02e28144ded6bc48f6a7b38b492ff
      TAG: v0.2.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$TARGET_SHA")" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^{tree}")" = "356aad661538192b9b04cbd19b66898879a73b43"
          git show "$TARGET_SHA:NoDuplicateCosmetics/__init__.py" | sha256sum | grep '^576ed747bd11cbdf9171dfb666b08dc45519185d76afbff0f5090c7a959cd137  -$'

      - name: Create GitHub release and tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "NoDuplicateCosmetics 0.2.3" \
            --notes-file research/results/release-0.2.3-notes.md

      - name: Remove one-off publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-0.2.3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-off 0.2.3 release publisher'
          git push origin HEAD:main
