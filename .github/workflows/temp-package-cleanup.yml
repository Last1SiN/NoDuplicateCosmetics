name: Temporary cleanup package

on:
  push:
    branches:
      - cleanup-v1.0.1

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package exact branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import tomllib
          import zipfile

          root = Path("NoDuplicateCosmetics")
          source = root / "__init__.py"
          metadata = root / "pyproject.toml"
          archive = Path("dist/NoDuplicateCosmetics.sdkmod")

          text = source.read_text(encoding="utf-8")
          compile(text, str(source), "exec")

          data = tomllib.loads(metadata.read_text(encoding="utf-8"))
          versions = (data["project"]["version"], data["tool"]["sdkmod"]["version"])
          assert versions[0] == versions[1] == "1.0.1"
          for version in versions:
              assert tuple(int(x) for x in version.split(".")) == (1, 0, 1)

          assert data["project"]["name"] == "NoDuplicateCosmetics"
          assert data["tool"]["sdkmod"]["name"] == "NoDuplicateCosmetics"
          assert data["tool"]["sdkmod"]["coop_support"] == "Unknown"
          assert data["tool"]["sdkmod"]["supported_games"] == ["BL3"]

          required = {
              "NoDuplicateCosmetics/__init__.py",
              "NoDuplicateCosmetics/pyproject.toml",
              "NoDuplicateCosmetics/README_EN.md",
              "NoDuplicateCosmetics/README_RU.md",
              "NoDuplicateCosmetics/LICENSE",
              "NoDuplicateCosmetics/ADDITIONAL_TERMS.md",
          }

          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts and path.suffix not in {".pyc", ".pyo"}:
                      zf.write(path, path.as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              roots = {n.split("/", 1)[0] for n in names}
              assert roots == {archive.stem} == {"NoDuplicateCosmetics"}
              assert required.issubset(set(names))
              assert len(names) == 6, names

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("ALL_GATES_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NoDuplicateCosmetics-cleanup-v1.0.1
          path: dist/NoDuplicateCosmetics.sdkmod
          if-no-files-found: error
