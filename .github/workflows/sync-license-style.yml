name: Sync GPLv3 license layout

on:
  push:
    branches:
      - docs/truefastball-style
    paths:
      - .github/workflows/sync-license-style.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/truefastball-style

      - name: Copy the exact GPLv3 license text used by TrueFastball
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Last1SiN/TrueFastball/main/LICENSE -o LICENSE
          cp LICENSE NoDuplicateCosmetics/LICENSE

      - name: Commit license files and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE NoDuplicateCosmetics/LICENSE
          git rm .github/workflows/sync-license-style.yml
          git commit -m "Add GPLv3 license files matching TrueFastball layout"
          git push origin HEAD:docs/truefastball-style
