name: Attach exact tested v0.2.3 sdkmod

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upload-exact-v0.2.3-asset.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rehydrate exact runtime-tested artifact
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/NoDuplicateCosmetics.sdkmod.b64 <<'B64'
          
          B64
          base64 --decode /tmp/NoDuplicateCosmetics.sdkmod.b64 > /tmp/NoDuplicateCosmetics.sdkmod
          echo '3762a2942478fe67a798b86ec91ad13c666bb2a7231221552db4493e6defc29a  /tmp/NoDuplicateCosmetics.sdkmod' | sha256sum --check --strict

      - name: Attach exact artifact to v0.2.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.2.3 /tmp/NoDuplicateCosmetics.sdkmod --clobber

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upload-exact-v0.2.3-asset.yml
          git commit -m "Remove one-off exact release asset uploader"
          git push origin HEAD:main
